<!DOCTYPE html>
<html>
  <head>
    <title>Hello World!</title>
    
  </head>
  <body>
      <div class="t"><div class="tt"><div class="ttt"><div class="tttt"></div></div></div></div>
      <div class="testcard">
        <div class="pfpandinfo">
            <div class="profilePicture">
                <img src="pfp.avif" />
            </div>
            <div class="userInformation">
                <h1>FirstName LastName</h1>
                <h1>Email Address</h1>
            </div>
        </div>
        <div class="recentPurchases">
            <h1>Recent Purchases</h1>
            <div class="sunken-box">
                <h1>Test</h1>
            </div>
        </div>
        
      </div>
      
      <style>
        body
        {
          font-family: Arial, Helvetica, sans-serif;
          background-color: #3c1518;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .t
        {
          width: 95%;
          height: 10000px;
          background-color: #69140e;
          display:flex;
          align-items:center;
          justify-content: center;
          box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .tt
        {
          width: 94%;
          height: 10000px;
          background-color: #a44200;
          display:flex;
          align-items:center;
          justify-content: center;
          box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .ttt
        {
          width: 93%;
          height: 10000px;
          background-color: #D58936;
          display:flex;
          align-items:center;
          justify-content: center;
          box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .tttt
        {
          width: 92%;
          height: 10000px;
          background-color: #f2f3ae;
          box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .testcard
        {
          /* From https://css.glass */
          position: absolute;
          margin: 0 auto;
          background: rgba(255, 255, 255, 0);
          border-radius: 16px;
          
          box-shadow: 0 4px 30px rgba(0, 0, 0, 1);
          backdrop-filter: blur(13.6px);
          -webkit-backdrop-filter: blur(13.6px);
          width: 95%;
          height: 1200px;
        }

        .profilePicture {
            margin: 20px;
            width: 200px;
        }

        .profilePicture img {
            width: 300px;
            height: 300px;
            border-radius: 150px;
            
        }

        .userInformation {
            margin-top: 50px;
            margin-left: 150px;
        }

        .userInformation h1 {
            font-size: 50px;
            
            
        }

        .sunken-box {
        /* 1. Make the background a step darker than the surrounding page */
        background: rgba(255, 255, 255, 0); 
        
        /* 2. Layer an inset top shadow and a subtle bottom border highlight */
        box-shadow: 
            inset 0px 3px 6px rgba(0, 0, 0, 0.15),  /* Top inner shadow for depth */
            inset 0px -1px 0px rgba(255, 255, 255, 0.6); /* Bottom inner edge reflection */
            
        /* Optional: A subtle border helps clearly define the boundary */
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 8px;
        padding: 20px;
        margin: 20px;
        height: 500px;
        }

        .pfpandinfo {
            display: flex;
        }

        .recentPurchases h1 {
            margin: 20px;
        }

        
      </style>
  </body>
</html>
